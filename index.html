<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0c10">
<title>Сетлист</title>
<style>
  :root{
    --bg:#0a0c10; --surface:#161b24; --surface-2:#1e242f;
    --fg:#eef2f7; --dim:#818c9e; --edge:#272e3a;
    --chord:#f0a93b; --accent:#5b9dff; --ok:#3ec98a; --bad:#ff6f6f;
    --ls:15px; --radius:10px;
  }
  [hidden]{display:none !important}
  *{box-sizing:border-box;touch-action:manipulation}          /* kills double-tap zoom */
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    padding:0 14px calc(70vh + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
  }
  button,select,input,textarea{font-family:inherit;font-size:16px}  /* <16px makes iOS zoom */

  /* ---------- header ---------- */
  header{
    position:static;margin:0 -14px 16px;
    padding:calc(env(safe-area-inset-top) + 6px) 14px 8px;
    background:transparent;border-bottom:1px solid var(--edge);
  }
  .top{display:flex;align-items:center;gap:8px;min-height:44px}
  .top h1{flex:1;margin:0;font-size:20px;font-weight:650;letter-spacing:-.02em;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel{padding:8px 0 4px;border-top:1px solid var(--edge);margin-top:6px}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .grow{flex:1}

  .btn{
    -webkit-appearance:none;appearance:none;border:1px solid var(--edge);
    background:transparent;color:var(--fg);border-radius:var(--radius);
    min-height:44px;min-width:44px;padding:0 14px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:active{background:var(--surface-2);transform:scale(.97)}
  .btn.primary{background:var(--chord);border-color:var(--chord);color:#1a1200}
  .btn.ghost{background:transparent}
  .btn.icon{padding:0 11px;font-size:19px;border-color:transparent}
  .btn.on{color:var(--chord)}

  .field{display:flex;align-items:center;background:transparent;border:1px solid var(--edge);
         border-radius:var(--radius);min-height:44px;padding:0 4px 0 12px;gap:6px}
  .field span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .field select{-webkit-appearance:none;appearance:none;background:transparent;border:0;color:var(--fg);
                font-weight:650;padding:0 26px 0 2px;min-height:42px;
                background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                                 linear-gradient(135deg,var(--dim) 50%,transparent 50%);
                background-position:calc(100% - 14px) 19px, calc(100% - 9px) 19px;
                background-size:5px 5px;background-repeat:no-repeat}
  .field select:focus{outline:none}

  .status{margin-top:9px;font-size:14px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .status b{color:var(--fg);font-weight:650}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
  .dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}

  /* ---------- setlist ---------- */
  .cards{list-style:none;padding:0;margin:0}
  .card{display:flex;align-items:baseline;gap:16px;cursor:pointer;
        padding:20px 2px;border-bottom:1px solid var(--edge)}
  .card:first-child{border-top:1px solid var(--edge)}
  .card:active{background:var(--surface)}
  .num{flex:none;color:var(--dim);font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
  .card .body{flex:1;min-width:0}
  .card .name{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
  .card .sub{margin-top:6px;font-size:14px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  .chip{font-size:14px}
  .chip.warn{color:var(--chord)}
  .chev{display:none}

  /* ---------- chart ---------- */
  .section{margin:36px 0 14px;font-size:calc(var(--ls) * 1.55);font-weight:800;
           letter-spacing:-.01em;color:var(--fg);
           border-left:5px solid var(--chord);padding-left:12px;line-height:1.2}
  .row{margin-bottom:6px;line-height:1.16}
  .seg{display:inline-block;vertical-align:bottom}
  .ch{display:block;color:var(--chord);font-weight:400;letter-spacing:-.01em;
      font-size:calc(var(--ls) * 1.5);line-height:1.18;white-space:pre;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ly{display:block;font-size:var(--ls);white-space:pre;letter-spacing:-.005em}
  .only .ch{font-size:calc(var(--ls) * 1.62)}
  .blank{height:calc(var(--ls) * .6)}

  /* ---------- editor / empty ---------- */
  .empty{padding:28px 0;color:var(--dim);line-height:1.7}
  .empty a{color:var(--accent)}
  .hint{font-size:14px;color:var(--dim);line-height:1.6;margin:12px 0}
  textarea,input.text{
    width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--edge);
    border-radius:var(--radius);padding:14px;
  }
  textarea{min-height:46vh;font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
           white-space:pre;overflow-x:auto}
  input.text{min-height:48px}
  textarea:focus,input.text:focus{outline:none;border-color:var(--accent)}
  .actions{display:flex;gap:10px;margin:14px 0}
  .actions .btn{flex:1}
</style>
</head>
<body>

<header id="hdr">
  <div class="top">
    <button class="btn ghost icon" id="back" hidden>‹</button>
    <h1 id="title">Сетлист</h1>
    <button class="btn ghost icon" id="gear" hidden title="Налаштування">⚙</button>
    <button class="btn ghost icon" id="edit" hidden title="Редагувати">✎</button>
    <button class="btn primary" id="add">Додати</button>
  </div>

  <div class="panel" id="panel" hidden>
    <div class="tools">
      <label class="field"><span>Тон</span><select id="key"></select></label>
      <label class="field"><span>Капо</span><select id="capo"></select></label>
      <div class="grow"></div>
      <button class="btn" id="fdn">A−</button>
      <button class="btn" id="fup">A+</button>
    </div>
    <div class="status" id="meta" hidden></div>
  </div>
  <div class="status" id="midi"><i class="dot"></i><span>MIDI…</span></div>
</header>

<ul class="cards" id="list"></ul>
<div id="song" hidden></div>
<div id="editor" hidden></div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ============ notation ============
   Holychords uses Slavic naming: H is B natural and B is B flat.
   Detect which family a chart uses and stay inside it, so a chord
   never changes alphabet just because you moved the key.            */
const SHARP_W=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_W =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SHARP_S=['C','C#','D','D#','E','F','F#','G','G#','A','B','H'];
const FLAT_S =['C','Db','D','Eb','E','F','Gb','G','Ab','A','B','H'];

const CHORD=/^\(?([A-H])([b#♭♯]?)((?:maj|min|sus|add|aug|dim|m|M|°|\+|\d|\(|\))*)(?:\/([A-H])([b#♭♯]?))?\)?[,;]?$/;
const SEPS=new Set(['|','||','-','/','x2','x3','x4','(x2)','(x3)','(x4)']);
const isSectionLine=t=>{ t=(t||'').trim(); return !!t && t.length<=32 && (SECTION_RE.test(t)||/:$/.test(t)); };
const SECTION_RE=/^(куплет|приспів|приспiв|припев|перед\s|передприспів|перехід|бридж|брідж|bridge|інтро|интро|intro|програш|проигрыш|кінцівка|концовка|outro|verse|chorus|pre-?chorus|соло|solo|финал|фінал)/i;

let DATA={midi:{up:64,down:65,channel:1,debounceMs:300},scrollFraction:.45,songs:[]};
let cur=-1, transpose=0, capo=0, fontSize=15, slavic=false, basePc=null, baseSuffix='';

function pcOf(root,acc){
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:slavic?10:11,H:11}[root];
  if(base===undefined) return null;
  let i=base;
  if(acc==='#'||acc==='♯') i++;
  if(acc==='b'||acc==='♭') i--;
  return ((i%12)+12)%12;
}
const nameOf=(i,flat)=>{ i=((i%12)+12)%12;
  return slavic?(flat?FLAT_S[i]:SHARP_S[i]):(flat?FLAT_W[i]:SHARP_W[i]); };
function shift(root,acc,n){ const p=pcOf(root,acc); return p===null?root+acc:nameOf(p+n,acc==='b'||acc==='♭'); }
function transposeToken(tok,n){
  if(!n) return tok;
  const m=tok.match(CHORD); if(!m) return tok;
  let out=shift(m[1],m[2],n)+(m[3]||'');
  if(m[4]) out+='/'+shift(m[4],m[5]||'',n);
  return out;
}
const isChordToken=t=>SEPS.has(t.toLowerCase())||CHORD.test(t);
function isChordLine(line){
  const t=line.trim();
  if(!t) return false;
  if(/[Ѐ-ӿ]/.test(t)) return false;
  if(!/[A-H]/.test(t)) return false;
  return t.split(/\s+/).every(isChordToken);
}
const detectSlavic=body=>body.split('\n').filter(isChordLine).join(' ').split(/\s+/).some(t=>/^H/.test(t));

/* ============ normalising a pasted chart ============ */
function normalise(raw){
  let lines=raw.replace(/\r/g,'').replace(/ /g,' ').split('\n').map(l =>
    l.replace(/\*\*/g,'').replace(/__/g,'').replace(/^#{1,6}\s*/,'').replace(/\s+$/,'')
  );
  // A blank line between a chord line and its lyric is a paste artefact — drop it.
  const out=[];
  for(let i=0;i<lines.length;i++){
    if(!lines[i].trim() && out.length && isChordLine(out[out.length-1])){
      let j=i; while(j<lines.length && !lines[j].trim()) j++;
      // join a chord line to its lyric, but never swallow the next heading
      if(j<lines.length && lines[j].trim() && !isChordLine(lines[j]) && !isSectionLine(lines[j])){ continue; }
    }
    out.push(lines[i]);
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function splitBlocks(body){
  const blocks=[[]];
  for(const line of body.split('\n')){
    if(!line.trim()) blocks.push([]); else blocks[blocks.length-1].push(line);
  }
  return blocks.filter(b=>b.length);
}
function pairsOf(block){
  const out=[];
  for(let i=0;i<block.length;i++){
    const line=block[i];
    if(isChordLine(line)){
      const next=block[i+1];
      if(next!==undefined && !isChordLine(next) && !isSectionLine(next)){ out.push({chords:line,lyric:next}); i++; }
      else out.push({chords:line,lyric:''});
      continue;
    }
    const t=line.trim();
    // A heading only counts if it says so — never merely because chords follow.
    if(isSectionLine(t)) out.push({section:t.replace(/:$/,'')});
    else out.push({chords:'',lyric:line});
  }
  return out;
}

/* ============ rendering ============ */
const steps=()=>transpose-capo;                       // shown = written + transpose − capo

function rebuildChordLine(line,n){
  const marks=[]; const re=/\S+/g; let m;
  while((m=re.exec(line))!==null) marks.push({col:m.index,text:transposeToken(m[0],n)});
  let out='';
  for(const k of marks){
    out += out.length>k.col ? ' ' : ' '.repeat(k.col-out.length);
    out += k.text;
  }
  return out;
}
function renderPair(chordLine,lyricLine){
  const row=document.createElement('div'); row.className='row';

  if(!lyricLine){                                     // chord-only line: keep its spacing
    row.classList.add('only');
    const ch=document.createElement('span'); ch.className='ch';
    ch.textContent=rebuildChordLine(chordLine,steps());
    row.append(ch); return row;
  }
  const marks=[]; const re=/\S+/g; let m;
  while((m=re.exec(chordLine))!==null) marks.push({col:m.index,text:m[0]});
  const cuts=[];
  if(!marks.length||marks[0].col>0) cuts.push({col:0,text:''});
  for(const c of marks) cuts.push({col:c.col,text:transposeToken(c.text,steps())});

  cuts.forEach((c,i)=>{
    const end=(i+1<cuts.length)?cuts[i+1].col:lyricLine.length;
    let piece=lyricLine.slice(c.col,Math.max(c.col,end));
    if(c.text&&piece.length&&piece.length<c.text.length+1&&i+1<cuts.length) piece+=' ';
    if(!c.text&&!piece) return;
    const seg=document.createElement('span'); seg.className='seg';
    const ch=document.createElement('span'); ch.className='ch'; ch.textContent=c.text||' ';
    const ly=document.createElement('span'); ly.className='ly'; ly.textContent=piece||' ';
    seg.append(ch,ly); row.append(seg);
  });
  return row;
}
function renderBody(host,body){
  host.textContent='';
  const blocks=splitBlocks(body).map(pairsOf);
  blocks.forEach((pairs,bi)=>{
    pairs.forEach(p=>{
      if(p.section){
        const el=document.createElement('div'); el.className='section';
        el.textContent=p.section; host.append(el); return;
      }
      host.append(renderPair(p.chords||'',p.lyric));
    });
    if(bi<blocks.length-1){ const b=document.createElement('div'); b.className='blank'; host.append(b); }
  });
}

/* ============ storage ============ */
const STORE='chord-stage-v1';
const PREFS='chord-stage-prefs-v1';
const loadPrefs=()=>{ try{ return JSON.parse(localStorage.getItem(PREFS)||'{}'); }catch(e){ return {}; } };
const savePrefs=o=>{ try{ localStorage.setItem(PREFS,JSON.stringify(o)); }catch(e){} };
function rememberView(){
  if(cur<0||basePc===null) return;
  const all=loadPrefs();
  all[DATA.songs[cur].title]={ key:((basePc+transpose)%12+12)%12, capo };
  savePrefs(all);
}
const loadLocal=()=>{ try{ return JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ return {}; } };
const saveLocal=o=>{ try{ localStorage.setItem(STORE,JSON.stringify(o)); return true; }catch(e){ return false; } };
function applyLocal(){
  const L=loadLocal();
  DATA.songs.forEach(s=>{ if(L[s.title]&&L[s.title].body) s.body=L[s.title].body; });
  Object.keys(L).forEach(t=>{
    if(!DATA.songs.some(s=>s.title===t)) DATA.songs.push({title:t,key:'',url:'',body:L[t].body});
  });
}

/* ============ key + capo controls ============ */
function firstChordOf(body){
  for(const line of body.split('\n')){
    if(!isChordLine(line)) continue;
    const tok=line.trim().split(/\s+/).find(t=>CHORD.test(t));
    if(tok) return tok.match(CHORD);
  }
  return null;
}
function buildCapo(){
  const sel=$('capo'); sel.textContent='';
  for(let i=0;i<=7;i++){
    const o=document.createElement('option'); o.value=i;
    o.textContent=i?('+'+i):'—';
    sel.append(o);
  }
}
function buildKeys(){
  const sel=$('key'); sel.textContent='';
  if(basePc===null){ sel.disabled=true; return; }
  sel.disabled=false;
  for(let i=0;i<12;i++){
    const o=document.createElement('option'); o.value=i;
    o.textContent=nameOf(i,false)+baseSuffix;
    sel.append(o);
  }
  sel.value=((basePc+transpose)%12+12)%12;
}
function updateMeta(){
  const el=$('meta');
  if(cur<0||basePc===null){ el.hidden=true; return; }
  const sounds=nameOf(basePc+transpose,false)+baseSuffix;
  const played=nameOf(basePc+transpose-capo,false)+baseSuffix;
  const bits=[];
  if(capo) bits.push('Грати <b>'+played+'</b> · капо <b>+'+capo+'</b> · звучить <b>'+sounds+'</b>');
  else bits.push('Тональність <b>'+sounds+'</b>');
  el.innerHTML=bits.join(' ');
  el.hidden=false;
}

/* ============ views ============ */
function showList(){
  cur=-1;
  $('song').hidden=true; $('editor').hidden=true; $('list').hidden=false;
  $('title').textContent='Сетлист';
  $('back').hidden=true; $('edit').hidden=true; $('add').hidden=false;
  $('gear').hidden=true; $('panel').hidden=true; $('meta').hidden=true;
  $('midi').hidden=false;
  
  window.scrollTo(0,0);
}
function openSong(i){
  cur=i; transpose=0; capo=0;
  const s=DATA.songs[i];
  $('list').hidden=true; $('editor').hidden=true; $('song').hidden=false;
  $('title').textContent=s.title;
  $('back').hidden=false; $('add').hidden=true;

  if(!s.body){
    $('edit').hidden=true; $('gear').hidden=true; $('panel').hidden=true; $('meta').hidden=true; $('midi').hidden=false;
    const d=$('song'); d.textContent='';
    const p=document.createElement('div'); p.className='empty';
    p.innerHTML='Акорди ще не додано.<br>'+
      (s.url?'Відкрий <a href="'+s.url+'" target="_blank" rel="noopener">holychords</a>, скопіюй і встав сюди.'
            :'Скопіюй акорди з holychords і встав сюди.');
    const btn=document.createElement('button'); btn.className='btn primary'; btn.textContent='Вставити акорди';
    btn.addEventListener('click',()=>showEditor(i));
    const wrap=document.createElement('div'); wrap.className='actions'; wrap.append(btn);
    d.append(p,wrap); window.scrollTo(0,0); return;
  }

  slavic=detectSlavic(s.body);
  const first=firstChordOf(s.body);
  basePc=first?pcOf(first[1],first[2]):null;
  baseSuffix=first&&/^m(?!aj)/.test(first[3]||'')?'m':'';
  const pref=loadPrefs()[s.title];
  if(pref && basePc!==null && typeof pref.key==='number'){
    transpose=pref.key-basePc;
    capo=pref.capo||0;
  }
  $('edit').hidden=false; $('gear').hidden=false; $('panel').hidden=true; $('midi').hidden=true;
  $('gear').classList.remove('on');
  buildKeys(); $('capo').value=capo;
  renderBody($('song'),s.body);
  updateMeta();
 
  window.scrollTo(0,0);
}
function buildList(){
  const ul=$('list'); ul.textContent='';
  DATA.songs.forEach((s,i)=>{
    const li=document.createElement('li'); li.className='card';
    const n=document.createElement('div'); n.className='num'; n.textContent=i+1;
    const body=document.createElement('div'); body.className='body';
    const name=document.createElement('div'); name.className='name'; name.textContent=s.title;
    const sub=document.createElement('div'); sub.className='sub';
    if(s.key){ const c=document.createElement('span'); c.className='chip'; c.textContent=s.key; sub.append(c); }
    if(!s.body){ const c=document.createElement('span'); c.className='chip warn'; c.textContent='без акордів'; sub.append(c); }
    body.append(name); if(sub.children.length) body.append(sub);
    const ch=document.createElement('div'); ch.className='chev'; ch.textContent='›';
    li.append(n,body,ch);
    li.addEventListener('click',()=>openSong(i));
    ul.append(li);
  });
}

/* ============ editor ============ */
function showEditor(idx){
  $('list').hidden=true; $('song').hidden=true;
  const host=$('editor'); host.hidden=false; host.textContent='';
  const existing=idx>=0?DATA.songs[idx]:null;
  $('title').textContent=existing?existing.title:'Нова пісня';
  $('back').hidden=false; $('edit').hidden=true; $('add').hidden=true;
  $('gear').hidden=true; $('panel').hidden=true; $('meta').hidden=true;
  $('midi').hidden=false;
  

  const hint=document.createElement('div'); hint.className='hint';
  hint.textContent='Встав акорди, скопійовані з holychords. Тональність і капо міняються потім, у плеєрі.';

  let nameInput=null;
  if(!existing){
    nameInput=document.createElement('input');
    nameInput.className='text'; nameInput.placeholder='Назва пісні';
  }
  const ta=document.createElement('textarea');
  ta.placeholder='Встав акорди сюди…';
  ta.value=existing&&existing.body?existing.body:'';

  const actions=document.createElement('div'); actions.className='actions';
  const save=document.createElement('button'); save.className='btn primary'; save.textContent='Зберегти';
  const cancel=document.createElement('button'); cancel.className='btn'; cancel.textContent='Скасувати';
  actions.append(cancel,save);
  const status=document.createElement('div'); status.className='hint';

  save.addEventListener('click',()=>{
    const body=normalise(ta.value);
    const title=existing?existing.title:((nameInput.value||'').trim()||'Без назви');
    if(!body){ status.textContent='Порожньо — нема що зберігати.'; return; }
    const L=loadLocal(); L[title]={body};
    if(!saveLocal(L)){ status.textContent='Не вдалося зберегти у цьому браузері.'; return; }
    let i=DATA.songs.findIndex(s=>s.title===title);
    if(i<0){ DATA.songs.push({title,key:'',url:'',body}); i=DATA.songs.length-1; }
    else DATA.songs[i].body=body;
    buildList(); openSong(i);
  });
  cancel.addEventListener('click',()=>existing?openSong(idx):showList());

  host.append(hint);
  if(nameInput) host.append(nameInput);
  host.append(ta,actions,status);
  window.scrollTo(0,0);
}

/* ============ MIDI ============ */
function setMidi(text,cls){
  const el=$('midi');
  el.innerHTML='<i class="dot '+(cls||'')+'"></i><span>'+text+'</span>';
}
const step=()=>Math.round(window.innerHeight*(DATA.scrollFraction||.45));
const lastHit={};
function onMidi(e){
  const [status,num,val]=e.data;
  if((status&0xf0)!==0xb0) return;
  const ch=(status&0x0f)+1;
  if(DATA.midi.channel&&ch!==DATA.midi.channel) return;
  // One tap = one move, whether the switch is momentary (127 then 0 at once)
  // or latching (127 this tap, 0 the next).
  const now=performance.now();
  if(lastHit[num]&&now-lastHit[num]<(DATA.midi.debounceMs||300)) return;
  lastHit[num]=now;
  if(num===DATA.midi.up)   window.scrollBy({top:-step(),behavior:'smooth'});
  if(num===DATA.midi.down) window.scrollBy({top: step(),behavior:'smooth'});
}
function initMidi(){
  if(!navigator.requestMIDIAccess){ setMidi('недоступний — відкрий у MIDIWeb Browser','bad'); return; }
  navigator.requestMIDIAccess().then(a=>{
    const attach=()=>{
      const names=[];
      for(const i of a.inputs.values()){ i.onmidimessage=onMidi; names.push(i.name); }
      names.length ? setMidi(names.join(', ')+' · CC64 ↑ CC65 ↓','ok')
                   : setMidi('педаль не знайдено','bad');
    };
    attach(); a.onstatechange=attach;
  }).catch(e=>setMidi('помилка: '+e.message,'bad'));
}

/* ============ wiring ============ */
const rerender=()=>{ if(cur>=0&&DATA.songs[cur].body){ renderBody($('song'),DATA.songs[cur].body); updateMeta(); } };

const syncSpacer=()=>{};
$('gear').addEventListener('click',()=>{
  const p=$('panel'); p.hidden=!p.hidden;
  $('midi').hidden=p.hidden;
  $('gear').classList.toggle('on',!p.hidden);
});

$('back').addEventListener('click',showList);
$('add').addEventListener('click',()=>showEditor(-1));
$('edit').addEventListener('click',()=>showEditor(cur));
$('key').addEventListener('change',e=>{ transpose=(+e.target.value)-basePc; rerender(); rememberView(); });
$('capo').addEventListener('change',e=>{ capo=+e.target.value; rerender(); rememberView(); });
$('fup').addEventListener('click',()=>{ fontSize=Math.min(fontSize+2,54); document.documentElement.style.setProperty('--ls',fontSize+'px'); });
$('fdn').addEventListener('click',()=>{ fontSize=Math.max(fontSize-2,15); document.documentElement.style.setProperty('--ls',fontSize+'px'); });

window.addEventListener('keydown',e=>{
  if(/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if(e.key==='ArrowDown'||e.key===' '){ e.preventDefault(); window.scrollBy({top:step(),behavior:'smooth'}); }
  if(e.key==='ArrowUp'){ e.preventDefault(); window.scrollBy({top:-step(),behavior:'smooth'}); }
  if(e.key==='Escape') showList();
});
// Belt and braces against pinch/double-tap zoom inside the chart.
document.addEventListener('gesturestart',e=>e.preventDefault());

buildCapo();
fetch('songs.json?v='+Date.now())
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(d=>{ DATA=Object.assign(DATA,d); applyLocal(); buildList(); })
  .catch(()=>{ applyLocal(); buildList(); });
initMidi();
</script>
</body>
</html>
