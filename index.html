<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сетлист</title>
<style>
  :root{--bg:#0d0f12;--fg:#f2f4f7;--chord:#ffb02e;--dim:#7b8494;--line:#232833;--accent:#3d82f6;--ls:26px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 16px calc(60vh + env(safe-area-inset-bottom)) 16px;-webkit-text-size-adjust:100%}

  header{position:sticky;top:0;z-index:10;background:rgba(13,15,18,.95);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600;flex:1 1 auto;min-width:40%}
  .btn{appearance:none;border:1px solid var(--line);background:#171b22;color:var(--fg);
       border-radius:9px;padding:8px 11px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:active{background:#222833}
  select.btn{padding-right:8px}
  .meta{font-size:13px;color:var(--dim);margin-top:6px;width:100%}
  .meta b{color:var(--fg);font-weight:600}
  #midi{font-size:12px;color:var(--dim);width:100%;margin-top:4px}
  #midi.ok{color:#35c07a}#midi.err{color:#ff6b6b}

  ul{list-style:none;padding:0;margin:0}
  li.song{border-bottom:1px solid var(--line);padding:15px 4px;cursor:pointer}
  li.song .t{font-size:20px}
  li.song .s{font-size:13px;color:var(--dim);margin-top:3px}
  li.song .s .warn{color:var(--chord)}

  .section{color:var(--dim);font-size:15px;margin:22px 0 6px;letter-spacing:.04em;text-transform:uppercase}
  .row{margin-bottom:4px;line-height:1.15}
  .seg{display:inline-block;vertical-align:bottom}
  .ch{display:block;color:var(--chord);font-weight:700;font-size:calc(var(--ls)*.8);line-height:1.25;white-space:pre}
  .ly{display:block;font-size:var(--ls);white-space:pre}
  .blank{height:calc(var(--ls)*.55)}
  .auto .ch{color:#9a7b3a}
  .btn.off{opacity:.42}
  .rowbtns{display:flex;gap:8px;margin:12px 0}

  .empty{padding:24px 0;color:var(--dim);font-size:16px;line-height:1.6}
  .empty a{color:var(--accent)}
  textarea{width:100%;min-height:240px;background:#12151b;color:var(--fg);border:1px solid var(--line);
           border-radius:10px;padding:12px;font:14px/1.4 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto}
  .hint{font-size:13px;color:var(--dim);line-height:1.6;margin:10px 0}
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="btn" id="back" hidden>‹</button>
    <h1 id="title">Сетлист</h1>
    <button class="btn" id="imp">Додати</button>
    <button class="btn" id="tdn" hidden>−½</button>
    <button class="btn" id="tup" hidden>+½</button>
    <select class="btn" id="capo" hidden></select>
    <button class="btn" id="edit" hidden>✎</button>
    <button class="btn" id="fdn" hidden>A−</button>
    <button class="btn" id="fup" hidden>A+</button>
  </div>
  <div class="meta" id="meta" hidden></div>
  <div id="midi">MIDI: …</div>
</header>

<ul id="list"></ul>
<div id="song" hidden></div>
<div id="import" hidden></div>

<script>
'use strict';

/* ---------------- notation ----------------
   Holychords uses Slavic naming: H = B natural, B = B flat.
   Western: B = B natural, Bb = B flat.
   We detect which one a song uses and transpose back into the same family,
   so a chart never changes alphabet just because you pressed +1/2.        */

const SHARP_W = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_W  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SHARP_S = ['C','C#','D','D#','E','F','F#','G','G#','A','B','H'];
const FLAT_S  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','B','H'];

const CHORD = /^\(?([A-H])([b#♭♯]?)((?:maj|min|sus|add|aug|dim|m|M|°|\+|\d|\(|\))*)(?:\/([A-H])([b#♭♯]?))?\)?[,;]?$/;
const SEPS = new Set(['|','||','-','/','x2','x3','x4','(x2)','(x3)','(x4)']);

let DATA = { midi:{up:64,down:65,channel:1,debounceMs:300}, scrollFraction:0.45, songs:[] };
let cur = -1, transpose = 0, capo = 0, fontSize = 26, slavic = false;

function pc(root, acc){
  const base = {C:0,D:2,E:4,F:5,G:7,A:9,B:slavic?10:11,H:11}[root];
  if (base === undefined) return null;
  let i = base;
  if (acc === '#' || acc === '♯') i++;
  if (acc === 'b' || acc === '♭') i--;
  return ((i % 12) + 12) % 12;
}
function name(i, flat){
  i = ((i % 12) + 12) % 12;
  return slavic ? (flat ? FLAT_S[i] : SHARP_S[i]) : (flat ? FLAT_W[i] : SHARP_W[i]);
}
function shift(root, acc, n){
  const p = pc(root, acc);
  if (p === null) return root + acc;
  return name(p + n, acc === 'b' || acc === '♭');
}
function transposeToken(tok, n){
  if (!n) return tok;
  const m = tok.match(CHORD);
  if (!m) return tok;
  let out = shift(m[1], m[2], n) + (m[3] || '');
  if (m[4]) out += '/' + shift(m[4], m[5] || '', n);
  return out;
}
function isChordToken(t){ return SEPS.has(t.toLowerCase()) || CHORD.test(t); }
function isChordLine(line){
  const t = line.trim();
  if (!t) return false;
  if (/[Ѐ-ӿ]/.test(t)) return false;   // any Cyrillic => it's lyrics
  if (!/[A-H]/.test(t)) return false;
  return t.split(/\s+/).every(isChordToken);
}
function detectSlavic(body){
  return body.split('\n').filter(isChordLine).join(' ').split(/\s+/)
             .some(t => /^H/.test(t));
}

const SECTION_RE = /^(куплет|приспів|приспiв|припев|перехід|бридж|bridge|інтро|интро|intro|програш|проигрыш|кінцівка|концовка|outro|verse|chorus|pre-?chorus|преприспів|соло|solo)\b/i;

function splitBlocks(body){
  const blocks = [[]];
  for (const line of body.replace(/\r/g,'').split('\n')){
    if (!line.trim()) blocks.push([]); else blocks[blocks.length-1].push(line);
  }
  return blocks.filter(b => b.length);
}
function pairsOf(block){
  const out = [];
  for (let i = 0; i < block.length; i++){
    const line = block[i];
    if (isChordLine(line)){
      const next = block[i+1];
      if (next !== undefined && !isChordLine(next)){ out.push({chords:line, lyric:next}); i++; }
      else out.push({chords:line, lyric:''});
      continue;
    }
    const t = line.trim();
    const nextIsChord = block[i+1] && isChordLine(block[i+1]);
    if (out.length === 0 && t.length <= 30 && (SECTION_RE.test(t) || /:$/.test(t) || nextIsChord))
      out.push({section:t});
    else out.push({chords:'', lyric:line});
  }
  return out;
}

/* ---------------- rendering ---------------- */

// displayed = written + transpose - capo
const shownSteps = () => transpose - capo;

function renderPair(chordLine, lyricLine){
  const row = document.createElement('div');
  row.className = 'row';
  const lyric = lyricLine || '';
  const marks = [];
  const re = /\S+/g; let m;
  while ((m = re.exec(chordLine)) !== null) marks.push({col:m.index, text:m[0]});

  const cuts = [];
  if (!marks.length || marks[0].col > 0) cuts.push({col:0, text:''});
  for (const c of marks) cuts.push({col:c.col, text:transposeToken(c.text, shownSteps())});

  cuts.forEach((c,i) => {
    const end = (i+1 < cuts.length) ? cuts[i+1].col : lyric.length;
    let piece = lyric.slice(c.col, Math.max(c.col, end));
    if (c.text && piece.length && piece.length < c.text.length + 1 && i+1 < cuts.length) piece += ' ';
    if (!c.text && !piece) return;
    const seg = document.createElement('span'); seg.className = 'seg';
    const ch = document.createElement('span'); ch.className = 'ch'; ch.textContent = c.text || ' ';
    const ly = document.createElement('span'); ly.className = 'ly'; ly.textContent = piece || ' ';
    seg.append(ch, ly); row.append(seg);
  });
  return row;
}

function renderBody(host, body){
  host.textContent = '';
  const blocks = splitBlocks(body).map(pairsOf);
  blocks.forEach((pairs, bi) => {
    pairs.forEach(p => {
      if (p.section){
        const el = document.createElement('div'); el.className = 'section';
        el.textContent = p.section; host.append(el); return;
      }
      host.append(renderPair(p.chords || '', p.lyric));
    });
    if (bi < blocks.length - 1){
      const b = document.createElement('div'); b.className = 'blank'; host.append(b);
    }
  });
}

/* ---------------- views ---------------- */

const $ = id => document.getElementById(id);
const CTRLS = ['back','tdn','tup','capo','edit','fdn','fup'];

function buildCapo(){
  const sel = $('capo'); sel.textContent='';
  for (let i=0;i<=7;i++){
    const o=document.createElement('option'); o.value=i;
    o.textContent = i ? 'Капо '+i : 'Без капо'; sel.append(o);
  }
}

function updateMeta(){
  if (cur < 0) return;
  const s = DATA.songs[cur];
  const written = s.key || '';
  const el = $('meta');
  if (!s.body){ el.hidden = true; return; }
  const parts = [];
  const base = written ? written.match(CHORD) : null;
  if (base){
    const p = pc(base[1], base[2]);
    const sounds = name(p + transpose, false) + (base[3]||'');
    const played = name(p + transpose - capo, false) + (base[3]||'');
    parts.push('Грати <b>'+played+'</b>');
    if (capo) parts.push('капо <b>'+capo+'</b>');
    parts.push('звучить <b>'+sounds+'</b>');
  } else {
    if (transpose) parts.push('транспон. <b>'+(transpose>0?'+':'')+transpose+'</b>');
    if (capo) parts.push('капо <b>'+capo+'</b>');
  }
  if (s.leader) parts.push('веде <b>'+s.leader+'</b>');
  el.innerHTML = parts.join(' · ');
  el.hidden = !parts.length;
}

function showList(){
  cur = -1;
  $('song').hidden = true; $('import').hidden = true; $('list').hidden = false;
  $('title').textContent = 'Сетлист';
  $('meta').hidden = true; $('imp').hidden = false;
  CTRLS.forEach(id => $(id).hidden = true);
  window.scrollTo(0,0);
}

function openSong(i){
  cur = i; transpose = 0; capo = 0;
  const s = DATA.songs[i];
  slavic = s.body ? detectSlavic(s.body) : false;
  $('list').hidden = true; $('import').hidden = true; $('song').hidden = false;
  $('title').textContent = s.title;
  $('imp').hidden = true;
  CTRLS.forEach(id => $(id).hidden = false);
  $('capo').value = 0;

  if (!s.body){
    CTRLS.filter(x=>x!=='back').forEach(id => $(id).hidden = true);
    const d = $('song'); d.textContent='';
    const p = document.createElement('div'); p.className='empty';
    p.innerHTML = 'Текст ще не додано.<br><br>' +
      (s.url ? 'Відкрий <a href="'+s.url+'" target="_blank" rel="noopener">holychords</a> ' : 'Відкрий пісню на holychords ') +
      'у сусідній вкладці, скопіюй акорди й встав їх сюди.';
    const go = document.createElement('button'); go.className='btn'; go.textContent='Вставити акорди';
    go.addEventListener('click', () => showImport(i));
    const wrap = document.createElement('div'); wrap.className='rowbtns'; wrap.append(go);
    d.append(p, wrap);
    $('meta').hidden = true;
    window.scrollTo(0,0);
    return;
  }
  renderBody($('song'), s.body);
  updateMeta();
  window.scrollTo(0,0);
}

function buildList(){
  const ul = $('list'); ul.textContent='';
  DATA.songs.forEach((s,i) => {
    const li = document.createElement('li'); li.className='song';
    const t = document.createElement('div'); t.className='t'; t.textContent = s.title;
    const sub = document.createElement('div'); sub.className='s';
    const bits = [];
    if (s.leader) bits.push('веде ' + s.leader);
    if (s.key) bits.push(s.key);
    sub.textContent = bits.join(' · ');
    if (!s.body){
      const w = document.createElement('span'); w.className='warn';
      w.textContent = (bits.length ? ' · ' : '') + 'без тексту';
      sub.append(w);
    }
    li.append(t, sub);
    li.addEventListener('click', () => openSong(i));
    ul.append(li);
  });
}

/* ---------------- import ---------------- */

/* Songs you paste are kept in this browser. Paste on the phone you play
   from and it stays there; songs.json in the repo only seeds the list.   */
const STORE = 'chord-stage-v1';
function loadLocal(){ try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e){ return {}; } }
function saveLocal(o){ try { localStorage.setItem(STORE, JSON.stringify(o)); return true; } catch(e){ return false; } }
function applyLocal(){
  const L = loadLocal();
  DATA.songs.forEach(s => { if (L[s.title] && L[s.title].body) s.body = L[s.title].body; });
  Object.keys(L).forEach(t => {
    if (!DATA.songs.some(s => s.title === t))
      DATA.songs.push({ title:t, leader:'', key:'', url:'', body:L[t].body });
  });
}

function showImport(idx){
  $('list').hidden = true; $('song').hidden = true;
  const host = $('import'); host.hidden = false; host.textContent = '';
  const existing = idx >= 0 ? DATA.songs[idx] : null;
  $('title').textContent = existing ? existing.title : 'Нова пісня';
  $('imp').hidden = true; CTRLS.forEach(id => $(id).hidden = true);
  $('back').hidden = false; $('meta').hidden = true;

  const hint = document.createElement('div'); hint.className = 'hint';
  hint.innerHTML = 'Скопіюй акорди з holychords у будь-якій тональності і встав сюди. ' +
                   'Транспонування, капо й автопідстановку акордів у куплети налаштуєш у плеєрі.';

  let nameInput = null;
  if (!existing){
    nameInput = document.createElement('input');
    nameInput.className = 'btn'; nameInput.style.width = '100%';
    nameInput.placeholder = 'Назва пісні';
  }

  const ta = document.createElement('textarea');
  ta.placeholder = 'Встав акорди сюди…';
  ta.value = existing && existing.body ? existing.body : '';

  const btns = document.createElement('div'); btns.className = 'rowbtns';
  const save = document.createElement('button'); save.className = 'btn'; save.textContent = 'Зберегти';
  const cancel = document.createElement('button'); cancel.className = 'btn'; cancel.textContent = 'Скасувати';
  const status = document.createElement('div'); status.className = 'hint';
  btns.append(save, cancel);

  const preview = document.createElement('div');
  const refresh = () => {
    const body = clean(ta.value);
    preview.textContent = '';
    if (!body.trim()) return;
    slavic = detectSlavic(body); transpose = 0; capo = 0;
    const n = body.split('\n').filter(isChordLine).length;
    const lbl = document.createElement('div'); lbl.className = 'hint';
    lbl.textContent = 'Рядків з акордами: ' + n + (slavic ? ' · нотація H' : ' · нотація B');
    preview.append(lbl);
    const box = document.createElement('div'); renderBody(box, body); preview.append(box);
  };
  ta.addEventListener('input', refresh);
  ta.addEventListener('paste', () => setTimeout(refresh, 0));

  save.addEventListener('click', () => {
    const body = clean(ta.value);
    const title = existing ? existing.title : (nameInput.value.trim() || 'Без назви');
    if (!body.trim()){ status.textContent = 'Порожньо — нема що зберігати.'; return; }
    const L = loadLocal(); L[title] = { body };
    if (!saveLocal(L)){ status.textContent = 'Не вдалося зберегти у цьому браузері.'; return; }
    let i = DATA.songs.findIndex(s => s.title === title);
    if (i < 0){ DATA.songs.push({ title, leader:'', key:'', url:'', body }); i = DATA.songs.length - 1; }
    else DATA.songs[i].body = body;
    buildList(); openSong(i);
  });
  cancel.addEventListener('click', () => existing ? openSong(idx) : showList());

  host.append(hint);
  if (nameInput) host.append(nameInput);
  host.append(ta, btns, status, preview);
  refresh();
  window.scrollTo(0,0);
}

function clean(t){
  return t.replace(/\r/g,'').replace(/ /g,' ').replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n');
}

/* ---------------- MIDI ---------------- */

function setMidi(t, c){ const e=$('midi'); e.textContent='MIDI: '+t; e.className=c||''; }

const step = () => Math.round(window.innerHeight * (DATA.scrollFraction || 0.45));
const last = {};

function onMidi(e){
  const [status, num, val] = e.data;
  if ((status & 0xf0) !== 0xb0) return;                                  // Control Change only
  const ch = (status & 0x0f) + 1;
  if (DATA.midi.channel && ch !== DATA.midi.channel) return;

  // One tap = one move, whether the switch is momentary (127 then 0 instantly)
  // or latching (127 on this tap, 0 on the next one).
  const now = performance.now();
  if (last[num] && now - last[num] < (DATA.midi.debounceMs || 300)) return;
  last[num] = now;

  if (num === DATA.midi.up)   window.scrollBy({top:-step(), behavior:'smooth'});
  if (num === DATA.midi.down) window.scrollBy({top: step(), behavior:'smooth'});
}

function initMidi(){
  if (!navigator.requestMIDIAccess){
    setMidi('недоступний — відкрий у MIDIWeb Browser', 'err'); return;
  }
  navigator.requestMIDIAccess().then(access => {
    const attach = () => {
      const names = [];
      for (const inp of access.inputs.values()){ inp.onmidimessage = onMidi; names.push(inp.name); }
      names.length ? setMidi(names.join(', ') + ' · CC64 ↑ CC65 ↓', 'ok')
                   : setMidi('пристрій не знайдено — підключи педаль і онови', 'err');
    };
    attach(); access.onstatechange = attach;
  }).catch(err => setMidi('помилка — ' + err.message, 'err'));
}

/* ---------------- wiring ---------------- */

function rerender(){ if (cur>=0 && DATA.songs[cur].body){ renderBody($('song'), DATA.songs[cur].body); updateMeta(); } }

$('back').addEventListener('click', showList);
$('imp').addEventListener('click', () => showImport(-1));
$('edit').addEventListener('click', () => showImport(cur));
$('tup').addEventListener('click', () => { transpose++; rerender(); });
$('tdn').addEventListener('click', () => { transpose--; rerender(); });
$('capo').addEventListener('change', e => { capo = +e.target.value; rerender(); });
$('fup').addEventListener('click', () => { fontSize=Math.min(fontSize+2,52); document.documentElement.style.setProperty('--ls',fontSize+'px'); });
$('fdn').addEventListener('click', () => { fontSize=Math.max(fontSize-2,14); document.documentElement.style.setProperty('--ls',fontSize+'px'); });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key==='ArrowDown'||e.key===' '){ e.preventDefault(); window.scrollBy({top:step(),behavior:'smooth'}); }
  if (e.key==='ArrowUp'){ e.preventDefault(); window.scrollBy({top:-step(),behavior:'smooth'}); }
  if (e.key==='Escape') showList();
});

buildCapo();
fetch('songs.json?v=' + Date.now())
  .then(r => { if(!r.ok) throw new Error('songs.json ' + r.status); return r.json(); })
  .then(d => { DATA = Object.assign(DATA, d); applyLocal(); buildList(); })
  .catch(() => { applyLocal(); buildList(); });

initMidi();
</script>
</body>
</html>
